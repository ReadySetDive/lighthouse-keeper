[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"

[preset.0.options]

; Single-threaded build avoids needing cross-origin isolation headers, which GitHub Pages cannot send
variant/thread_support=false
; Installable from Chrome's menu as a full-screen, portrait-locked app
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=0
progressive_web_app/orientation=2
progressive_web_app/background_color=Color(0.043, 0.051, 0.102, 1)
